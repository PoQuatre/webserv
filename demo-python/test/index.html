<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webserv Test Page</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f2f2;
    margin:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
    padding:10px 18px;
    cursor:pointer;
}

input,textarea{
    width:100%;
    padding:8px;
    margin:8px 0;
}

pre{
    background:#222;
    color:#0f0;
    padding:10px;
    overflow:auto;
}

.success{
    color:green;
}

.error{
    color:red;
}
</style>
</head>

<body>

<div class="container">


<div class="card">

<h2>2. CGI GET Test</h2>

<form action="./hello.py" method="GET">

<label>Your name</label>

<input
name="name"
placeholder="Alice">

<button>
Call CGI
</button>

</form>

</div>

<div class="card">

<h2>3. CGI POST Test</h2>

<form
action="echo.py"
method="POST">

<label>Message</label>

<textarea
name="message"
rows="5"
placeholder="Hello CGI"></textarea>

<button>
Send POST
</button>

</form>

</div>

</body>
</html>
