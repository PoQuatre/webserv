http {
    server {
        listen 127.0.0.1:8382;
        root /srv/www;

        location /cgi {
            cgi_pass /usr/bin/python3;
        }

        location /bin {
            cgi_pass /bin/sh;
            cgi_timeout 30s;
            cgi_output_buffer_size 4M;
        }

        location /static {
            root /srv/static;
        }
    }
}
